# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # DORA needs the deploy's start time; GITHUB_ENV is the only state that
      # survives between steps.
      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Gate on boot health (RC1-355). flyctl deploy exiting 0 is not evidence the
      # app runs: with min_machines_running = 0 the machine stops right after
      # release, and a stopped machine's fly.toml check reports "warning", not
      # "critical" — so the deploy succeeds whether or not the image can boot.
      # That is how the RC1-322 crash-loop shipped silently. Requesting the public
      # URL forces a cold start and exercises the same path a real request takes.
      - name: Gate on boot health
        env:
          HEALTH_URL: https://pr-review-agent-snacksnack.fly.dev/healthz
        run: |
          set -uo pipefail
          # Three consecutive passes, not the first 200: a crash-loop can answer
          # once before the machine restarts underneath it.
          deadline=$((SECONDS + 180))
          ok=0
          while [ "$ok" -lt 3 ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$HEALTH_URL never stayed healthy for 3 consecutive checks within 180s"
              exit 1
            fi
            # curl -w always prints a code (000 on connection failure), so no
            # fallback is needed — an "|| echo 000" here doubles it in the log.
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$HEALTH_URL")
            if [ "$code" = "200" ]; then
              ok=$((ok + 1))
              echo "healthy ($ok/3)"
            else
              if [ "$ok" -gt 0 ]; then
                echo "::warning::flapped after $ok consecutive passes (HTTP $code) — possible restart loop"
              fi
              ok=0
              echo "not healthy yet (HTTP $code)"
            fi
            [ "$ok" -ge 3 ] || sleep 10
          done
          echo "boot health confirmed on $HEALTH_URL"

      # Register the deploy with Datadog DORA (RC1-336). Runs only after the boot
      # health gate, so a DORA deployment event means the app actually serves — not
      # merely that flyctl exited 0. DORA deployments are a separate data source
      # from CI Visibility: deployment frequency and lead time compute from these
      # events, and lead time additionally needs commit_sha + repository_url to
      # join the git metadata. Timestamps are nanoseconds. A failed POST fails the
      # workflow on purpose: the deploy is live either way, but an unrecorded
      # deploy silently undercounts the delivery dashboard.
      - name: Report deploy to Datadog DORA
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          SERVICE: pr-review-agent-snacksnack
          REPO_URL: https://github.com/snacksnack/pr_agent
        run: |
          set -euo pipefail
          payload=$(printf '{"data":{"attributes":{"service":"%s","env":"prod","started_at":%s000000000,"finished_at":%s000000000,"git":{"commit_sha":"%s","repository_url":"%s"}}}}' \
            "$SERVICE" "$DEPLOY_STARTED_AT" "$(date +%s)" "$GITHUB_SHA" "$REPO_URL")
          code=$(curl -s -o resp.json -w '%{http_code}' -m 30 -X POST \
            -H "DD-API-KEY: $DD_API_KEY" -H "Content-Type: application/json" \
            -d "$payload" "https://api.datadoghq.com/api/v2/dora/deployment")
          cat resp.json; echo
          case "$code" in
            2*) echo "DORA deployment recorded (HTTP $code)";;
            *) echo "::error::DORA deployment POST failed with HTTP $code — this deploy is live but unrecorded"; exit 1;;
          esac
