name: CI

# RC1-256. This repo had no workflows at all while shipping an agent that
# enforces code quality on other people's pull requests — fourteen test modules,
# none of them running on push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # The suite itself stays credential-free, deliberately: it is fixture-
      # and mock-driven, and a test that needs a live key is a finding to fix
      # rather than a secret to add. DD_API_KEY below is not a test
      # credential — it is the Test Optimization reporter (RC1-452), and the
      # suite passes identically without it.
      - name: Test (pytest, with coverage floor)
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: pr_agent
          DD_ENV: ci
        run: pytest --ddtrace --cov

      # Exercises app/__main__.py, which is omitted from the coverage figure
      # for exactly this reason. It prints which credentials are set without
      # printing any value, so it is safe to run with none configured — and it
      # catches a settings change that breaks startup before a deploy does.
      - name: Config sanity check
        run: python -m app
